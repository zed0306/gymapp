# Каждый пуш в main публикует сайт: GitHub Pages раздаёт ветку gh-pages
name: Deploy mini app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Publish to gh-pages
        run: git push --force origin HEAD:gh-pages
